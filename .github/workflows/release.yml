name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller tzdata
      - name: Test
        run: python -m pytest -q
        env:
          NODEBOOK_NO_BROWSER: "1"
      - name: Build
        run: python scripts/build_exe.py --zip
      - uses: actions/upload-artifact@v4
        with:
          name: nodebook-${{ matrix.os }}
          path: dist/Nodebook-*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Nodebook-*.zip

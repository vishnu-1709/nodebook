[project]
name = "nodebook"
version = "0.0.1"
description = "Turn lecture slides into an editable mind map you study from. Local-first."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "python-pptx>=0.6.23",
  "platformdirs>=4.0",
  "psutil>=5.9",
  "dateparser>=1.2",
  "fsrs>=4.0",
  "genanki>=0.13",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]

[tool.setuptools]
packages = []
